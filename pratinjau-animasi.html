<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Karakter — Petualangan Angka</title><link rel="stylesheet" href="aset/css/anime.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff5e4;background:#18163b url('aset/background/kerajaan-angka.png') center/cover fixed;font-family:'Trebuchet MS',sans-serif}main{max-width:1050px;margin:auto;padding:40px 24px}header,.studio{background:#171739dd;border:1px solid #ffffff44;border-radius:24px;padding:24px;backdrop-filter:blur(12px)}header{margin-bottom:20px}small{color:#9fe5e8;letter-spacing:3px}h1{font-size:clamp(24px,5vw,44px);margin:8px 0}p{color:#ddd8f6;line-height:1.6}.cast{display:grid;grid-template-columns:1fr 1fr;gap:24px}.studio{text-align:center}.character-stage{height:360px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button,a{font:inherit;font-weight:bold;border-radius:12px;padding:11px 15px;border:1px solid #ffffff66;color:white;background:#5a439b;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#7860c0}a{display:inline-block;margin-top:10px;background:#ffcd70;color:#28203e}h2{margin-bottom:5px}@media(max-width:600px){.cast{grid-template-columns:1fr}.character-stage{height:300px}main{padding:18px}}</style></head><body><main><header><small>STUDIO KARAKTER · 2D ANIME</small><h1>Sahabat petualanganmu.</h1><p>Raka menjaga perisai angka. Robo Arka siap menemani! Coba animasi mereka, lalu mulai misimu.</p><a href="index.html">▶ Buka game</a></header><div class="cast"><section class="studio"><div class="character-stage"><span class="character-motion raka" data-character="raka"><img class="character-art" src="aset/karakter/raka.png" alt="Raka Angka"></span></div><h2>Raka Angka</h2><p>Penjelajah dengan perisai ajaib</p><div class="controls"><button onclick="AnimeCharacters.react('raka','wave')">Menyapa</button><button onclick="AnimeCharacters.react('raka','cheer')">
